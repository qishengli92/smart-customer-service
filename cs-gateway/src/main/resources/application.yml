server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true

spring:
  application:
    name: smart-customer-service
  main:
    banner-mode: off
  flyway:
    enabled: false

  # PostgreSQL 数据源
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cs_agent}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000

  # JPA：MVP 用 ddl-auto 建表；生产可切 Flyway
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  # Redis 配置
  # 注意：若本机 6379 已被其他服务占用（如 Langfuse Redis 且带密码），
  # 请改端口或设置 REDIS_PASSWORD，例如：
  #   export REDIS_HOST=127.0.0.1 REDIS_PORT=6380
  #   或 export REDIS_PASSWORD=myredissecret
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:myredissecret}
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# ====== DashScope 模型配置 ======
cs:
  model:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      embedding-model: text-embedding-v3
      models:
        router:
          name: qwen3.7-plus
          temperature: 0.1
          max-tokens: 512
        supervisor:
          name: qwen3.7-plus
          temperature: 0.3
          max-tokens: 1024
        expert:
          name: qwen3.7-plus
          temperature: 0.5
          max-tokens: 2048
        chitchat:
          name: qwen3.7-plus
          temperature: 0.7
          max-tokens: 1024

  # ====== LangFuse 可观测性配置（双轨） ======
  # Track A: ingestion → 会话/Router/Agent 业务 Trace
  # Track B: OTLP GenAI → LLM Prompt / Tool（对齐 AgentScope-demo）
  observability:
    langfuse:
      enabled: true
      public-key: ${LANGFUSE_PUBLIC_KEY:pk-your-public-key}
      secret-key: ${LANGFUSE_SECRET_KEY:sk-your-secret-key}
      base-url: ${LANGFUSE_HOST:http://localhost:3000}
      flush-enabled: true
      otel-enabled: true

  # ====== Milvus 向量数据库配置 ======
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    database: default
    collection-prefix: cs_          # → cs_knowledge, cs_memory
    top-k: 5
    similarity-threshold: 0.7
    embedding-dimension: 1024
    auto-seed: true

  # ====== 知识库 RAG ======
  knowledge:
    upload-dir: ${CS_KNOWLEDGE_UPLOAD_DIR:./data/knowledge}
    chunk-size: 700
    chunk-overlap: 100
    recall-k: 20
    max-upload-bytes: 10485760
    rerank:
      enabled: true
      model: gte-rerank-v2
      top-n: 5

  # ====== Agent 配置 ======
  agent:
    router:
      confidence-threshold: 0.7
      max-retries: 2
    memory:
      short-term:
        max-messages: 50
        ttl-minutes: 60
      long-term:
        embedding-dimension: 1024
        similarity-threshold: 0.75
    risk-control:
      auto-approve-threshold: 100
      require-confirmation-amount: 500

  # ====== 订单 MCP 客户端（cs-order-service） ======
  order:
    mcp:
      enabled: true
      url: ${ORDER_MCP_URL:http://localhost:8081/mcp}
      timeout-seconds: 30

# ====== Actuator 配置 ======
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: smart-customer-service

# ====== 日志配置 ======
logging:
  level:
    root: INFO
    com.cs: DEBUG
    io.milvus: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.apache.tika: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ====== WebFlux 配置 ======
spring.codec.max-in-memory-size: 15MB
